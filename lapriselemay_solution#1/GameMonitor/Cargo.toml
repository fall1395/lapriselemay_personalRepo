[package]
name = "game_monitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Overlay de monitoring natif et léger pour PC de jeu Windows"
license = "MIT OR Apache-2.0"
authors = ["Félix Lemay"]
repository = "https://github.com/lemayfelix/GameMonitor"

[[bin]]
name = "GameMonitor"
path = "src/main.rs"

[dependencies]
ferrisetw = "1.2.0"
nvml-wrapper = "0.13.0"
log = "0.4"
# Sans "multithread" : évite le pool de threads rayon, inutile ici.
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "network", "disk"] }
wmi = "0.18.4"
env_logger = "0.10"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
